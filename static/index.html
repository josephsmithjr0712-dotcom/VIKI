<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--text:#eaf0ff;--muted:#8d9ab8;--accent:#7ff5d8;--blue:#4a63ff;--violet:#8a4dff;--warn:#ffc46b;--bad:#ff7a8a;
--glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.09);--edge:rgba(255,255,255,.14);
--font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.6 var(--font);color:var(--text);background:var(--bg);overflow:hidden}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 28s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vw;height:46vw;background:var(--blue);left:-10vw;top:-12vw}
.orbs i:nth-child(2){width:38vw;height:38vw;background:#13b5a6;right:-8vw;bottom:-10vw;animation-delay:-9s;opacity:.4}
.orbs i:nth-child(3){width:30vw;height:30vw;background:var(--violet);right:22vw;top:-10vw;animation-delay:-17s;opacity:.35}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.12)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 20px 50px -20px rgba(0,0,0,.6)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;gap:16px;height:100%;padding:16px;max-width:1360px;margin:auto}
aside{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:12px;background:conic-gradient(from 210deg,var(--accent),var(--blue),var(--violet),var(--accent));display:grid;place-items:center;box-shadow:0 0 24px rgba(127,245,216,.35)}
.mark::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}
.brand b{font-size:20px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-4px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--edge);background:var(--glass-2);border-radius:14px;padding:10px 14px;font-weight:600;transition:background .2s,transform .1s}
.btn:hover{background:rgba(255,255,255,.15)}.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(127,245,216,.9),rgba(110,140,255,.9));color:#04121a;border-color:transparent}
h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.mem{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.mem div{display:flex;gap:8px;justify-content:space-between;font-size:13px;padding:8px 10px;border-radius:12px;background:var(--glass)}
.mem button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1}.mem button:hover{color:var(--bad)}
.empty-note{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;color:var(--text);font:inherit;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:6px 0}
.sw{appearance:none;width:40px;height:23px;border-radius:99px;background:var(--glass-2);border:1px solid var(--edge);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(17px);background:#04121a}
.tools{display:flex;flex-wrap:wrap;gap:6px}.tools span{font:12px var(--mono);padding:4px 9px;border-radius:9px;background:var(--glass);color:var(--muted)}
.conns{display:flex;flex-direction:column;gap:6px}
.conn{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:12px;background:var(--glass)}
.conn .cdot{width:8px;height:8px;border-radius:50%;background:#3a4560;flex:none;margin-top:5px}
.conn.on .cdot{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.conn small{display:block;color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:2px}
.ts{font-size:11px;color:var(--muted);opacity:.65}
.msg.user .ts{align-self:flex-end}
main{border-radius:30px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--edge)}
.status{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.orb-core{width:34px;height:34px;border-radius:50%;position:relative;flex:none;
 background:radial-gradient(circle at 35% 35%,rgba(127,245,216,.95),rgba(74,99,255,.55) 55%,rgba(20,30,60,.9));
 box-shadow:0 0 18px rgba(127,245,216,.45),inset 0 0 12px rgba(255,255,255,.25);
 animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 0 28px rgba(127,245,216,.7),inset 0 0 14px rgba(255,255,255,.3)}}
.busy .orb-core{background:radial-gradient(circle at 35% 35%,rgba(255,196,107,.95),rgba(255,122,138,.5) 55%,rgba(60,25,35,.9));
 box-shadow:0 0 24px rgba(255,196,107,.65);animation:busySpin 1.8s linear infinite}
@keyframes busySpin{to{filter:hue-rotate(50deg)}}
.speaking .orb-core::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.busy .dot{animation:pulse 1s ease-in-out infinite;background:var(--warn);box-shadow:0 0 12px var(--warn)}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
.model{font:12px var(--mono);color:var(--muted);padding:5px 10px;border-radius:10px;background:var(--glass)}
#feed{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.hero{margin:auto;text-align:center;max-width:560px}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:10px 0 22px}
.sugg{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sugg button{text-align:left;padding:13px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);color:var(--text);transition:background .2s,border-color .2s}
.sugg button:hover{background:var(--glass-2);border-color:rgba(127,245,216,.5)}
.msg{max-width:min(760px,92%);display:flex;flex-direction:column;gap:10px}
.msg.user{align-self:flex-end}
.bubble{padding:12px 16px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.user .bubble{background:linear-gradient(135deg,rgba(74,99,255,.55),rgba(138,77,255,.45));border:1px solid rgba(160,170,255,.35);border-bottom-right-radius:6px}
.agent .bubble{background:var(--glass);border:1px solid var(--edge);border-bottom-left-radius:6px;white-space:normal}
.bubble p+p,.bubble ul,.bubble pre{margin-top:8px}.bubble ul{padding-left:20px}
.bubble a{color:var(--accent)}
.bubble code{font:13px var(--mono);background:rgba(0,0,0,.3);padding:1px 6px;border-radius:6px}
.bubble pre{background:rgba(0,0,0,.4);border:1px solid var(--edge);border-radius:12px;padding:12px;overflow:auto}.bubble pre code{background:none;padding:0}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;margin-left:3px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think{font-size:13px;color:var(--muted);border-left:2px solid var(--violet);padding:2px 12px;font-style:italic;max-height:140px;overflow:auto}
.plan{border-radius:18px;padding:14px 16px}
.plan h4{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.plan li{list-style:none;display:flex;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.plan li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;position:relative;top:3px}
.plan li.doing i{border-color:var(--warn);background:radial-gradient(var(--warn) 40%,transparent 45%);animation:pulse 1.2s infinite}
.plan li.done i{background:var(--accent);border-color:var(--accent)}.plan li.done{color:var(--muted);text-decoration:line-through}
details.tool{border-radius:14px;background:var(--glass);border:1px solid var(--edge);font-size:13px}
details.tool summary{cursor:pointer;padding:9px 13px;display:flex;gap:10px;align-items:center;list-style:none}
details.tool summary::-webkit-details-marker{display:none}
.tn{font:500 12.5px var(--mono);color:var(--accent)}.ta{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.spin{width:12px;height:12px;border:2px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;flex:none}
details.tool.ok .spin{animation:none;border:0;background:var(--accent);border-radius:50%;width:8px;height:8px}
@keyframes rot{to{transform:rotate(360deg)}}
details.tool pre{font:12px/1.5 var(--mono);color:var(--muted);padding:0 13px 12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.approve{border-radius:18px;padding:14px 16px;border-color:rgba(255,196,107,.5)}
.approve p{font-size:14px;margin-bottom:10px}.approve code{font:12px var(--mono);color:var(--warn);display:block;white-space:pre-wrap;margin:6px 0 12px;max-height:140px;overflow:auto}
.approve .row{gap:10px}
.err{color:var(--bad)}
form{display:flex;gap:10px;align-items:flex-end;padding:14px 18px 18px}
.box{flex:1;display:flex;align-items:flex-end;gap:6px;border-radius:22px;padding:6px 8px 6px 16px;background:rgba(0,0,0,.25);border:1px solid var(--edge)}
.box:focus-within{border-color:rgba(127,245,216,.6);box-shadow:0 0 0 3px rgba(127,245,216,.12)}
textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:160px;padding:8px 0}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:var(--glass-2);display:grid;place-items:center;flex:none;font-size:17px}
.icon.on{background:var(--bad)}.send{background:linear-gradient(135deg,var(--accent),#7a9bff);color:#04121a;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.hist-empty{color:var(--muted);font-size:12px;padding:4px 2px}
.hist-item{text-align:left;background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px;color:var(--text);width:100%}
.hist-item:hover{border-color:var(--accent)}
.hist-item .hp{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.hist-item .hd{color:var(--muted);font-size:10px}
.hist-item.active{border-color:var(--accent)}
@media(max-width:860px){.app{grid-template-columns:1fr;padding:8px}aside{display:none}header{padding:12px 16px}#feed{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="glass">
    <div class="brand"><div class="mark"></div><div><b>VIKI</b><small>Autonomous agent</small></div></div>
    <button class="btn primary" id="new">New chat</button>
    <section><h3>History</h3><div class="hist" id="hist"><div class="hist-empty">No past chats yet</div></div></section>
    <section><h3>Settings</h3>
      <label class="toggle">Show reasoning<input type="checkbox" class="sw" id="think"></label>
      <label class="toggle">Read replies aloud<input type="checkbox" class="sw" id="speak"></label>
    </section>
    <section><h3>What I remember</h3><div class="mem" id="mem"></div>
      <form class="row" id="memform" style="padding:10px 0 0"><input type="text" id="memin" placeholder="Add a fact" autocomplete="off"><button class="btn" style="padding:8px 12px">Add</button></form>
    </section>
    <section><h3>Tools</h3><div class="tools" id="tools"></div></section>
    <section><h3>Connectors</h3><div class="conns" id="conns"></div></section>
  </aside>
  <main class="glass" id="shell">
    <header><div class="status"><span class="orb-core"></span><span id="status">Ready</span></div><span class="model" id="model">connecting</span></header>
    <div id="feed"></div>
    <form id="form">
      <div class="box glass"><textarea id="input" rows="1" placeholder="Give VIKI a task" aria-label="Message"></textarea>
        <button type="button" class="icon" id="mic" title="Dictate" aria-label="Dictate">🎙</button></div>
      <button type="button" class="icon" id="stop" style="display:none" title="Stop" aria-label="Stop">■</button>
      <button class="icon send" id="send" title="Send" aria-label="Send">↑</button>
    </form>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), sid=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
let session=sid, busy=false;
const feed=$('#feed'), input=$('#input');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUGG=["Research the best budget mechanical keyboards and save a short comparison to keyboards.md",
"What's the weather in Tokyo this week, and what should I pack?",
"Work out the monthly payment on a $24,000 loan at 6.5% over 5 years"];

function md(t){
  let s=esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c}</code></pre>`);
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return s.split(/\n{2,}/).map(p=>/^\s*[-*] /.test(p)?'<ul>'+p.split('\n').map(l=>'<li>'+l.replace(/^\s*[-*] /,'')+'</li>').join('')+'</ul>':p.startsWith('<pre')?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
function hero(){
  feed.innerHTML=`<div class="hero"><h1>What should we get done?</h1><p>I plan, search the web, read and send mail, manage your calendar, drive my own browser, control your Roku and Home Mini, and write files — all on your machine. I'll ask before anything that changes something.</p><div class="sugg">${SUGG.map(s=>`<button>${esc(s)}</button>`).join('')}</div></div>`;
  feed.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>send(b.textContent));
}
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;
 const t=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 d.innerHTML=html+`<span class="ts">${t}</span>`;feed.append(d);feed.scrollTop=feed.scrollHeight;return d}
function setBusy(b,t){busy=b;$('#shell').classList.toggle('busy',b);$('#status').textContent=t||(b?'Working':'Ready');$('#stop').style.display=b?'grid':'none';$('#send').style.display=b?'none':'grid'}
let edgeAudio=null;
async function speakEdge(text){
  try{
    if(edgeAudio){edgeAudio.pause();edgeAudio=null}
    $('#shell').classList.add('speaking');
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok) throw new Error('tts '+r.status);
    const url=URL.createObjectURL(await r.blob());
    edgeAudio=new Audio(url);
    edgeAudio.onended=edgeAudio.onerror=()=>{$('#shell').classList.remove('speaking');URL.revokeObjectURL(url);edgeAudio=null};
    edgeAudio.play();
  }catch(e){ $('#shell').classList.remove('speaking'); }
}

async function send(text){
  text=(text||input.value).trim(); if(!text||busy) return;
  if(feed.querySelector('.hero')) feed.innerHTML='';
  input.value=''; input.style.height='auto';
  add('user',`<div class="bubble">${esc(text)}</div>`);
  const turn=add('agent',''); let bubble=null, raw='', thinkEl=null, planEl=null; const tools={};
  const ensureBubble=()=>{if(!bubble){bubble=document.createElement('div');bubble.className='bubble cursor';turn.append(bubble)}};
  setBusy(true);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,message:text,think:$('#think').checked})});
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){ if(!p.startsWith('data: ')) continue; const {kind,data}=JSON.parse(p.slice(6));
        if(kind==='status') $('#status').textContent=data;
        else if(kind==='thinking'){ if(!thinkEl){thinkEl=document.createElement('div');thinkEl.className='think';turn.insertBefore(thinkEl,bubble)} thinkEl.textContent+=data; thinkEl.scrollTop=1e6 }
        else if(kind==='token'){ ensureBubble(); raw+=data; bubble.innerHTML=md(raw) }
        else if(kind==='reset_answer'){ raw=''; if(bubble){bubble.remove();bubble=null} thinkEl=null }
        else if(kind==='plan'){ if(!planEl){planEl=document.createElement('div');planEl.className='plan glass';turn.prepend(planEl)}
          planEl.innerHTML='<h4>Plan</h4><ul>'+data.map(s=>`<li class="${esc((s.status||'pending').toLowerCase())}"><i></i><span>${esc(s.text||'')}</span></li>`).join('')+'</ul>' }
        else if(kind==='tool_start'){ if(data.name==='update_plan') continue; const d=document.createElement('details');d.className='tool';
          d.innerHTML=`<summary><span class="spin"></span><span class="tn">${esc(data.name)}</span><span class="ta">${esc(Object.values(data.args).join(' · ').slice(0,90))}</span></summary><pre>${esc(JSON.stringify(data.args,null,2))}</pre>`;
          tools[data.id]=d; turn.append(d); $('#status').textContent='Using '+data.name }
        else if(kind==='tool_result'){ const d=tools[data.id]; if(d){d.classList.add('ok');d.querySelector('pre').textContent+='\n\n→ '+data.result} }
        else if(kind==='approval'){ const a=document.createElement('div');a.className='approve glass';
          a.innerHTML=`<p><b>${esc(data.name)}</b> wants to run:</p><code>${esc(JSON.stringify(data.args,null,2))}</code><div class="row"><button class="btn primary" data-ok="1">Allow</button><button class="btn" data-ok="0">Deny</button></div>`;
          a.querySelectorAll('button').forEach(b=>b.onclick=()=>{fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:data.id,ok:b.dataset.ok==='1'})});a.remove()});
          turn.append(a); $('#status').textContent='Waiting for your approval' }
        else if(kind==='done'){ ensureBubble(); bubble.classList.remove('cursor');
          if(data.type==='error'){bubble.classList.add('err');bubble.textContent=data.content} else {bubble.innerHTML=md(data.content||'(no answer)')}
          if($('#speak').checked&&data.content){speakEdge(data.content)} }
        feed.scrollTop=feed.scrollHeight;
      }
    }
  }catch(e){ ensureBubble(); bubble.classList.remove('cursor'); bubble.classList.add('err'); bubble.textContent='Connection lost: '+e.message }
  setBusy(false); loadState();
}
const CONNS=[
 {label:'Google',tools:['gmail_search'],hint:'python -m connectors.google_auth'},
 {label:'GitHub',tools:['github_search_repos'],hint:'GITHUB_TOKEN in .env'},
 {label:'Browser',tools:['browser_goto'],hint:'pip install playwright'},
 {label:'Home Mini',tools:['announce'],hint:'pip install pychromecast'},
 {label:'Roku',tools:['roku_play_movie'],hint:'Roku integration in Home Assistant'},
 {label:'Plex',tools:['plex_play'],hint:'PLEX_URL + PLEX_TOKEN in .env'},
 {label:'Spotify',tools:['spotify_play'],hint:'python -m connectors.spotify_auth'},
 {label:'Voice loop',tools:[],hint:'python voice_loop.py',manual:true},
];
async function loadState(){
  try{const s=await (await fetch('/api/state')).json(); $('#model').textContent=s.model;
    $('#tools').innerHTML=s.tools.map(t=>`<span>${esc(t)}</span>`).join('');
    $('#conns').innerHTML=CONNS.map(c=>{const on=c.manual?null:c.tools.some(t=>s.tools.includes(t));
      return `<div class="conn${on?' on':''}"><span class="cdot"></span><div>${esc(c.label)}<small>${esc(on===false||c.manual?c.hint:'connected')}</small></div></div>`}).join('');
    renderMem(s.memory)}catch{$('#model').textContent='offline'}
}
function renderMem(m){ $('#mem').innerHTML=m.length?m.map((f,i)=>`<div><span>${esc(f)}</span><button data-i="${i+1}" aria-label="Forget">×</button></div>`).join(''):'<p class="empty-note">Nothing yet. I\'ll pick up preferences as we talk.</p>';
  $('#mem').querySelectorAll('button').forEach(b=>b.onclick=async()=>renderMem((await (await fetch('/api/memory',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:+b.dataset.i})})).json()).memory)) }
$('#memform').onsubmit=async e=>{e.preventDefault();const v=$('#memin').value.trim();if(!v)return;$('#memin').value='';
  renderMem((await (await fetch('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fact:v})})).json()).memory)};
$('#form').onsubmit=e=>{e.preventDefault();send()};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();input.focus()}});
input.oninput=()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px'};
$('#stop').onclick=()=>fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session})});
$('#new').onclick=async()=>{await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session})});session=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));hero();loadState();loadHistory()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.interimResults=false;let on=false;
  rec.onresult=e=>{input.value=(input.value+' '+e.results[0][0].transcript).trim();input.oninput()};
  rec.onend=()=>{on=false;$('#mic').classList.remove('on')};
  $('#mic').onclick=()=>{on?rec.stop():(rec.start(),on=true,$('#mic').classList.add('on'))}} else $('#mic').style.display='none';
// --- Chat history ---
async function loadHistory(){
  try{
    const r = await fetch('/api/sessions');
    if(!r.ok) return;
    const {sessions} = await r.json();
    const el = $('#hist');
    if(!sessions.length){ el.innerHTML = '<div class="hist-empty">No past chats yet</div>'; return; }
    el.innerHTML = sessions.map(s=>{
      const d = s.started ? new Date(s.started).toLocaleDateString([], {month:'short',day:'numeric'}) : '';
      const t = s.started ? new Date(s.started).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      return `<button class="hist-item" data-sid="${esc(s.id)}"><span class="hd">${esc(d)} ${esc(t)} · ${s.message_count} msgs</span><span class="hp">${esc(s.preview||'(no preview)')}</span></button>`;
    }).join('');
    el.querySelectorAll('.hist-item').forEach(b=>b.onclick=()=>openSession(b.dataset.sid, b));
  }catch(e){ /* history unavailable */ }
}
async function openSession(sid, btn){
  try{
    document.querySelectorAll('.hist-item').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    const r = await fetch('/api/sessions/'+encodeURIComponent(sid));
    if(!r.ok) throw new Error('load failed');
    const {session: s} = await r.json();
    feed.innerHTML = '';
    (s.messages||[]).forEach(m=>{
      const cls = m.role === 'user' ? 'user' : 'viki';
      const d = document.createElement('div');
      d.className = 'msg '+cls;
      const t = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      d.innerHTML = md(m.content||'') + (t?`<span class="ts">${esc(t)}</span>`:'');
      feed.append(d);
    });
    feed.scrollTop = feed.scrollHeight;
    // continue this conversation under a new live session id
    session = sid;
  }catch(e){ add('viki', '<p>Could not load that chat.</p>'); }
}
hero(); loadState(); loadHistory();
</script>
</body>
